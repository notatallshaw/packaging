[tool.flit.sdist]
include = ["tests/", "docs/", "CHANGELOG.rst"]
exclude = [
  "docs/_build",
  "tests/manylinux/build-hello-world.sh",
  "tests/musllinux/build.sh",
  "tests/hello-world.c",
  "tests/__pycache__",
  "build/__pycache__",
]

[tool.typos.default.extend-identifiers]
iMatix = "iMatix"
ANDed = "ANDed"
ORed = "ORed"

[tool.typos.default.extend-words]
certifi = "certifi"
dynamc = "dynamc"
notin = "notin"
nd = "nd"
tou = "tou"

[tool.coverage.run]
branch = true
source_pkgs = ["packaging"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    "@(abc.)?abstractmethod",
    "@(abc.)?abstractproperty",
    "if (typing.)?TYPE_CHECKING:",
    "@(typing.)?overload",
    "def __dir__()",
]

[tool.pytest.ini_options]
minversion = "6.2"
addopts = [
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not property",        # property based tests opt-in only
    "--capture=sys",       # avoids per-test fd dup2/lseek syscalls (~20% of the runtime)
    "-p",
    "no:logging",          # no test uses caplog and its per-test setup is measurable
    "-p",
    "no:threadexception",  # no threads, avoids extra gc
    "-p",
    "no:tmpdir",           # no usage of tempdir (mostly sans IO)
    "-p",
    "no:legacypath",       # no legacy paths
]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
markers = ["property: property-based tests (opt-in)"]


[tool.mypy]
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unused_ignores = true
python_version = "3.10"
files = ["src", "tests", "noxfile.py"]
native_parser = true

[[tool.mypy.overrides]]
module = ["_manylinux", "pretend"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = [
    "src/packaging/licenses/_spdx.py"
]
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A002",    # function args shadowing builtins is fine
    "C9",      # complexity
    "COM812",  # trailing commas teach the formatter
    "CPY001",  # no copyright messages in files (for now)
    "D",       # doc formatting
    "EM",      # flake8-errmsg
    "ERA",     # commented out code
    "FBT",     # boolean positional args (existing API)
    "FIX",     # has todos
    "ISC004",  # unparenthesized implicit string concatenation in collection
    "N818",    # exceptions must end in "*Error"
    "PLR09",   # too many ...
    "PLR2004", # magic value in comparison
    "PLW0127", # duplicate of F821
    "PTH",     # pathlib
    "RET505",  # unused else/elif after return
    "RET506",  # unused else/elif after raise
    "RET507",  # unused else/elif after continue
    "RET508",  # unused else/elif after break
    "S101",    # assert is used by mypy and pytest
    "S105",    # the name token doesn't mean it's a password
    "S603",    # check for untrusted input
    "SIM103",  # returning negated value directly not ideal for long chain
    "SIM105",  # try/except is faster than contextlib.suppress
    "SLF001",  # private member access
    "TD",      # todo format
    "TRY003",  # long messages outside exception class
]
flake8-comprehensions.allow-dict-calls-with-keyword-arguments = true
flake8-import-conventions.extend-aliases = { datetime = "datetime" }
flake8-unused-arguments.ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["PYI024", "PLR", "SIM201", "T20", "S301"]
"tasks/*.py" = ["T20"]
"tasks/check_frozen_revs.py" = ["ANN401"]
"tests/test_requirements.py" = ["UP032"]
"src/packaging/_musllinux.py" = ["T20"]
"docs/conf.py" = ["INP001", "S", "A001"]
"noxfile.py" = ["T20", "S"]

[tool.nab]
mode = "universal"
decision-order = "stable"
uploaded-prior-to = "P7D"
default-groups = ["dev"]
conflicts = [[
  { group = "test" },
  { group = "docs" },
