# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    install:
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH" -r pylock.dev.toml --group docs
      - uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH" --no-deps --no-build-isolation -e .

sphinx:
  configuration: docs/conf.py
