[tool.nab]
mode = "universal"
decision-order = "stable"
uploaded-prior-to = "P7D"
default-groups = ["dev"]
conflicts = [[
  { group = "test" },
  { group = "docs" },
  { group = "benchmark" },
  { group = "dev" },
  { group = "downstream-packaging-legacy" },
  { group = "downstream-build" },
  { group = "downstream-setuptools" },
  { group = "downstream-pyproject-metadata" },
  { group = "downstream-pip" },
  { group = "downstream-dependency-groups" },
  { group = "downstream-dep-logic" },
  { group = "downstream-twine" },
  { group = "downstream-cibuildwheel" },
  { group = "downstream-hatchling" },
  { group = "downstream-tox" },
  { group = "downstream-virtualenv" },
  { group = "downstream-pdm" },
  { group = "downstream-poetry-core" },
  { group = "downstream-pipenv" },
  { group = "downstream-pip-wheels" },
  { group = "lint" },
  { group = "nox" },
  { group = "locks" },
  { group = "licenses" },
  { group = "pickle-21-0" },
  { group = "pickle-24-0" },
  { group = "pickle-25-0" },
  { group = "pickle-26-0" },
  { group = "pickle-26-1" },
]]

[tool.nab.matrix]
python = ">=3.10,<3.13"
platforms = ["linux_x86_64", "linux_aarch64", "macos_x86_64", "macos_arm64", "windows_amd64"]

[[tool.nab.matrix.include]]
python = ">=3.13,<3.16"
free-threaded = [true, false]

[[tool.nab.matrix.include]]
python = "==3.10"
implementations = ["pypy"]
platforms = [{id="linux_x86_64",pypy-abi="pp73"},{id="linux_aarch64",pypy-abi="pp73"},{id="macos_x86_64",pypy-abi="pp73"},{id="macos_arm64",pypy-abi="pp73"},{id="windows_amd64",pypy-abi="pp73"}]

[[tool.nab.matrix.include]]
python = "==3.11"
implementations = ["pypy"]
platforms = [{id="linux_x86_64",pypy-abi="pp80"},{id="linux_aarch64",pypy-abi="pp80"},{id="macos_x86_64",pypy-abi="pp80"},{id="macos_arm64",pypy-abi="pp80"},{id="windows_amd64",pypy-abi="pp80"}]

[[tool.nab.matrix.include]]
python = "==3.12"
platforms = [{id="linux_x86_64", libc="musl", runs-on-libc="1.2"}]

# The pinned PDM release needs this wheel before its cooldown ends.
[tool.nab.packages."hishel==2.0.0"]
uploaded-prior-to = "2026-11-05T14:10:40.115929Z"

# Hypothesis source builds are unavailable on PyPy and free-threaded CPython.
[tool.nab.packages.hypothesis]
dist-policy = "wheel-only"
