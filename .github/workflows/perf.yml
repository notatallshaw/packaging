name: Performance Benchmarks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  asv-continuous:
    name: ASV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - parallel:
          - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
            name: Install Pythons
            with:
              python-version: |
                3.10
                3.11
                3.12
                3.13
                3.14
                3.15
              allow-prereleases: true

          - name: Install uv
            uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
            with:
              cache-suffix: ${{ github.job }}

      - name: Use Python 3.14 for ASV
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Setup ASV
        run: >-
          uvx --python 3.14 pipx@1.18.13 install --force --suffix=-packaging
          --backend uv --lock pylock.dev.toml --pip-args=--no-index nox

      - name: Run ASV continuous benchmark
        run: uvx --python 3.14 pipx@1.18.13 exec nox-packaging nox -s benchmark -- continuous origin/main HEAD --interleave-rounds --sort default --no-only-changed | tee -a asv_output.txt || true

      - name: Write out to GitHub Summary
        run: sed -n '/All benchmarks/,$p' asv_output.txt >> "$GITHUB_STEP_SUMMARY"
