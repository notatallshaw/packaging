name: ASV quartile experiment

on:
  push:
    branches: [stack/asv-quartile-experiment]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare estimators (${{ matrix.order }}, ${{ matrix.trial }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
        trial: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Pythons
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15
          allow-prereleases: true
      - name: Install ASV
        run: python -m pip install asv==0.6.6 asv-runner==0.3.2
      - name: Register ASV machine
        run: asv machine --yes
      - name: Measure unchanged source and regressions
        env:
          ORDER: ${{ matrix.order }}
        run: python tasks/asv_quartile_experiment.py "$ORDER" control-results
      - name: Upload benchmark samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: quartile-${{ matrix.order }}-${{ matrix.trial }}
          path: control-results/
