name: ASV noise experiment

on:
  push:
    branches: [experiment/asv-noise-20261122]

permissions: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
        order: [forward, reverse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install asv==0.6.6 asv-runner==0.3.2
      - run: lscpu
      - run: asv machine --yes
      - run: python tasks/asv_noise_experiment.py "$PYTHON_VERSION" "$ORDER" noise-results
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          ORDER: ${{ matrix.order }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: noise-${{ matrix.python }}-${{ matrix.order }}
          path: noise-results/
